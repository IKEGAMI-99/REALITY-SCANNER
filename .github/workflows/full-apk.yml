name: Full AI APK

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/full-apk.yml"
      - "app/**"
      - "scripts/**"
      - "signing/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-full:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Install stable debug signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 -d signing/reality-scanner-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install pinned YOLO and QNN export toolchain
        run: |
          python -m pip install ultralytics onnx onnxslim
          python -m pip install "onnxruntime==1.26.0" "onnxruntime-qnn==2.4.0"
          python - <<'PY'
          import onnxruntime as ort
          import importlib.metadata as md
          print("onnxruntime", ort.__version__)
          print("onnxruntime-qnn", md.version("onnxruntime-qnn"))
          PY

      - name: Export YOLO26x compatibility model
        run: |
          python scripts/export_yolo26.py
          test -s yolo26x.onnx
          mkdir -p app/src/main/assets/models
          mv yolo26x.onnx app/src/main/assets/models/yolo26x.onnx

      - name: Export Snapdragon QNN and fast fallback models
        run: |
          python scripts/export_yolo26_qnn.py
          test -s qnn_s_bundle/model.onnx
          test -s qnn_n_bundle/model.onnx
          test "$(find qnn_s_bundle -maxdepth 1 -name '*.bin' -type f -size +0c | wc -l)" -gt 0
          test "$(find qnn_n_bundle -maxdepth 1 -name '*.bin' -type f -size +0c | wc -l)" -gt 0
          test -s yolo26n.onnx
          test -s yolo26s.onnx

          rm -rf app/src/main/assets/models/qnn_s app/src/main/assets/models/qnn_n
          mkdir -p app/src/main/assets/models/qnn_s app/src/main/assets/models/qnn_n
          cp -a qnn_s_bundle/. app/src/main/assets/models/qnn_s/
          cp -a qnn_n_bundle/. app/src/main/assets/models/qnn_n/
          cp yolo26n.onnx app/src/main/assets/models/yolo26n.onnx
          cp yolo26s.onnx app/src/main/assets/models/yolo26s.onnx

          echo "QNN-S bundle:"
          ls -lh app/src/main/assets/models/qnn_s/
          echo "QNN-N bundle:"
          ls -lh app/src/main/assets/models/qnn_n/
          echo "All models:"
          du -ah app/src/main/assets/models/ | sort -h | tail -30

      - name: Build full debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk REALITY-SCANNER-v0.2.0-TRACK-NPU-GPU.apk
          test -s REALITY-SCANNER-v0.2.0-TRACK-NPU-GPU.apk
          ls -lh REALITY-SCANNER-v0.2.0-TRACK-NPU-GPU.apk

      - uses: actions/upload-artifact@v4
        with:
          name: reality-scanner-v0.2.0
          path: REALITY-SCANNER-v0.2.0-TRACK-NPU-GPU.apk
          retention-days: 30

      - name: Publish GitHub Release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Improves live/demo tracking with class-tolerant greedy association, alpha-beta motion filtering, label voting, false-positive confirmation, shorter stale-track lifetime, and detector-latency HUD compensation. Normalizes QNN EPContext source metadata for current ORT QNN compatibility and adds a QNN GPU float-model path before CPU fallback."
          if gh release view v0.2.0 >/dev/null 2>&1; then
            gh release upload v0.2.0 REALITY-SCANNER-v0.2.0-TRACK-NPU-GPU.apk --clobber
          else
            gh release create v0.2.0 REALITY-SCANNER-v0.2.0-TRACK-NPU-GPU.apk \
              --title "REALITY SCANNER v0.2.0" \
              --notes "$NOTES"
          fi
