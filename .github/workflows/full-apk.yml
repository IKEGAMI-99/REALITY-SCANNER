name: Full AI APK

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/full-apk.yml"
      - "app/**"
      - "scripts/**"
      - "signing/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-full:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Install stable debug signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 -d signing/reality-scanner-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install YOLO export dependencies
        run: |
          python -m pip install ultralytics onnx onnxslim

      - name: Export YOLO26x to ONNX
        run: |
          python scripts/export_yolo26.py
          test -s yolo26x.onnx
          mkdir -p app/src/main/assets/models
          mv yolo26x.onnx app/src/main/assets/models/yolo26x.onnx
          ls -lh app/src/main/assets/models/yolo26x.onnx

      - name: Build full debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk REALITY-SCANNER-v0.1.2-FULL-YOLO26x.apk
          test -s REALITY-SCANNER-v0.1.2-FULL-YOLO26x.apk
          ls -lh REALITY-SCANNER-v0.1.2-FULL-YOLO26x.apk

      - uses: actions/upload-artifact@v4
        with:
          name: reality-scanner-full-ai-v0.1.2
          path: REALITY-SCANNER-v0.1.2-FULL-YOLO26x.apk
          retention-days: 30

      - name: Publish GitHub Release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.2 >/dev/null 2>&1; then
            gh release upload v0.1.2 REALITY-SCANNER-v0.1.2-FULL-YOLO26x.apk --clobber
          else
            gh release create v0.1.2 REALITY-SCANNER-v0.1.2-FULL-YOLO26x.apk \
              --title "REALITY SCANNER v0.1.2" \
              --notes "Smooth-tracking update: camera analysis and YOLO inference are fully asynchronous, BBoxes are extrapolated between detector refreshes, track matching uses predicted positions, and XNNPACK is used before generic CPU fallback."
          fi
