name: Full AI APK

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/full-apk.yml"
      - "app/**"
      - "scripts/**"
      - "signing/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-full:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Install stable debug signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 -d signing/reality-scanner-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install pinned YOLO and QNN export toolchain
        run: |
          python -m pip install ultralytics onnx onnxslim
          # Keep AOT context generation ABI-aligned with the Android runtime.
          python -m pip install "onnxruntime==1.26.0" "onnxruntime-qnn==2.4.0"
          python - <<'PY'
          import onnxruntime as ort
          import importlib.metadata as md
          print("onnxruntime", ort.__version__)
          print("onnxruntime-qnn", md.version("onnxruntime-qnn"))
          PY

      - name: Export YOLO26x compatibility model
        run: |
          python scripts/export_yolo26.py
          test -s yolo26x.onnx
          mkdir -p app/src/main/assets/models
          mv yolo26x.onnx app/src/main/assets/models/yolo26x.onnx

      - name: Export Snapdragon HTP QNN live models
        run: |
          python scripts/export_yolo26_qnn.py
          test -s yolo26s_v79_qnn.onnx
          test -s yolo26n_v79_qnn.onnx
          test -s yolo26n.onnx
          mv yolo26s_v79_qnn.onnx app/src/main/assets/models/yolo26s_v79_qnn.onnx
          mv yolo26n_v79_qnn.onnx app/src/main/assets/models/yolo26n_v79_qnn.onnx
          # Fast CPU/XNNPACK escape hatch if HTP initialization is unavailable on a vendor build.
          cp yolo26n.onnx app/src/main/assets/models/yolo26n.onnx
          ls -lh app/src/main/assets/models/

      - name: Build full debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk REALITY-SCANNER-v0.1.4-QNN-FIX.apk
          test -s REALITY-SCANNER-v0.1.4-QNN-FIX.apk
          ls -lh REALITY-SCANNER-v0.1.4-QNN-FIX.apk

      - uses: actions/upload-artifact@v4
        with:
          name: reality-scanner-qnn-fix-v0.1.4
          path: REALITY-SCANNER-v0.1.4-QNN-FIX.apk
          retention-days: 30

      - name: Publish GitHub Release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.4 >/dev/null 2>&1; then
            gh release upload v0.1.4 REALITY-SCANNER-v0.1.4-QNN-FIX.apk --clobber
          else
            gh release create v0.1.4 REALITY-SCANNER-v0.1.4-QNN-FIX.apk \
              --title "REALITY SCANNER v0.1.4" \
              --notes "QNN compatibility fix: pins AOT export to ORT 1.26.0 + onnxruntime-qnn 2.4.0 / QAIRT 2.48.x to match the Android runtime. Adds YOLO26n 640 XNNPACK fallback so a failed HTP probe no longer drops straight to YOLO26x/960 at ~4 seconds per frame."
          fi
